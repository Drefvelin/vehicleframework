behemoth:
    name: "§l§eBehemoth"
    model: behemoth
    skins:
        behemoth:
            name: "Behemoth"
            model: behemoth
    death:
        explode:
            fragments: 30
            duration: 320
            sounds:
                explode:
                    sound: "vehicleframework:explosion"
                    pitch: 1.0
                    volume: 8.0
    behaviour:
        rotator: body_controller
        vector: move.movealign
        float: true
        float-in:
            - WATER
            - KELP
    containers:
        cargo_hold_1:
            seat: passenger_1
            name: "§eCargo Hold 1"
            size: 54
        cargo_hold_2:
            seat: passenger_2
            name: "§eCargo Hold 2"
            size: 54
        cargo_hold_3:
            seat: passenger_3
            name: "§eCargo Hold 3"
            size: 54
        cargo_hold_4:
            seat: passenger_4
            name: "§eCargo Hold 4"
            size: 54
    utilities:
        horn:
            sound: "vehicleframework:big_horn"
            pitch: 1.0
            volume: 16.0
    states:
        flying:
            animations:
                default:
                    - regular
                forward:
                    - forward
                backward:
                    - backward
                right:
                    - right
                left:
                    - left
            keybinds:
                W: THROTTLE_UP
                SPACE_W: THROTTLE_UP
                SHIFT_W: THROTTLE_UP
                S: THROTTLE_DOWN
                SPACE_S: THROTTLE_DOWN
                SHIFT_S: THROTTLE_DOWN
                A: TURN_LEFT
                SPACE_A: TURN_LEFT
                SHIFT_A: TURN_LEFT
                D: TURN_RIGHT
                SPACE_D: TURN_RIGHT
                SHIFT_D: TURN_RIGHT
                SPACE: UP
                SHIFT: DOWN
                SHIFT_LEFT_CLICK: SEAT_SELECTION
                LEFT_CLICK: HORN
        floating:
            switch-parameters:
                velocity:
                    y: -0.8,0.8
            animations:
                default:
                    - regular
                forward:
                    - forward
                backward:
                    - backward
                right:
                    - right
                left:
                    - left
            keybinds:
                W: THROTTLE_UP
                SPACE_W: THROTTLE_UP
                SHIFT_W: THROTTLE_UP
                S: THROTTLE_DOWN
                SPACE_S: THROTTLE_DOWN
                SHIFT_S: THROTTLE_DOWN
                A: TURN_LEFT
                SPACE_A: TURN_LEFT
                SHIFT_A: TURN_LEFT
                D: TURN_RIGHT
                SPACE_D: TURN_RIGHT
                SHIFT_D: TURN_RIGHT
                SPACE: UP
                SHIFT_LEFT_CLICK: SEAT_SELECTION
        ground:
            switch-parameters:
                velocity:
                    y: -0.5,0.5
            animations:
                forward:
                    - forward
                backward:
                    - backward
            keybinds:
                W: THROTTLE_UP
                SPACE_W: THROTTLE_UP
                S: THROTTLE_DOWN
                SPACE_S: THROTTLE_DOWN
                SPACE: UP
                SHIFT_LEFT_CLICK: SEAT_SELECTION
    components:
        engine:
            sounds:
                steam_engine:
                    sound: "vehicleframework:steam_engine"
                    pitched: true
                    pitch: 1.0
                    volume: 6.0
                water_move:
                    sound: "vehicleframework:ship_water_move"
                    pitch: 1.0
                    volume: 4.0
            particles:
                    exhaust:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 4
                        spread: 0.3
                        speed: 0.04
            particle-bones:
                - exhaust.exhaustalign
                - exhaust2.exhaustalign2
                - exhaust3.exhaustalign3
                - exhaust4.exhaustalign4
            health: 580.0
            repair-time: 100
            fuel-burn-rate: 12
            fuel: arcane_fuel
            fuel-capacity: 16000
            refuel-states:
                - GROUND
            damage-chance: 0.7
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.3)
                - bullet(1.5)
                - entity_explosion(2.0)
                - small_bomb(10.0)
                - cannonball(1.8)
                - torpedo(7.0)
                - flak_bullet(5.0)
            max: 100
            min: -20
            speed: 0.27
            turn-rate: 0.16
            vfx:
                - engine_vfx_1
                - engine_vfx_2
                - engine_vfx_3
        hull:
            health: 1150.0
            repair-time: 160
            damage-chance: 1.0
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.3)
                - bullet(0.7)
                - entity_explosion(2.0)
                - small_bomb(10.0)
                - cannonball(1.8)
                - torpedo(7.0)
                - flak_bullet(3.0)
            vfx:
                - hull_vfx_1
                - hull_vfx_2
        balloon:
            health: 2000.0
            repair-time: 200
            damage-chance: 1.0
            lift: 0.2
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.3)
                - bullet(2.0)
                - entity_explosion(2.0)
                - small_bomb(10.0)
                - cannonball(1.8)
                - torpedo(7.0)
                - flak_bullet(3.0)
