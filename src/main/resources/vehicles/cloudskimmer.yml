cloudskimmer:
    name: "§l§eCloudskimmer"
    model: cloudskimmer
    skins:
        cloudskimmer:
            name: "Cloudskimmer"
            model: cloudskimmer
        cloudskimmer_prism:
            name: "Cloudskimmer (Prism)"
            model: cloudskimmer_prism
        cloudskimmer_norain:
            name: "Cloudskimmer (Norain)"
            model: cloudskimmer_norain
    death:
        explode:
            fragments: 30
            duration: 320
            sounds:
                explode:
                    sound: "vehicleframework:explosion"
                    pitch: 1.0
                    volume: 8.0
    behaviour:
        turn-scaling: false
        rotator: body_controller
        vector: move.movealign
        float: true
        float-in:
            - WATER
            - KELP
    containers:
        cargo_hold:
            seat: passenger
            name: "§eCargo Hold"
            size: 54
    states:
        flying:
            animations:
                default:
                    - regular
                forward:
                    - forward
                backward:
                    - backward
                right:
                    - right
                left:
                    - left
            keybinds:
                W: THROTTLE_UP
                SPACE_W: THROTTLE_UP
                SHIFT_W: THROTTLE_UP
                S: THROTTLE_DOWN
                SPACE_S: THROTTLE_DOWN
                SHIFT_S: THROTTLE_DOWN
                A: TURN_LEFT
                SPACE_A: TURN_LEFT
                SHIFT_A: TURN_LEFT
                D: TURN_RIGHT
                SPACE_D: TURN_RIGHT
                SHIFT_D: TURN_RIGHT
                SPACE: UP
                SHIFT: DOWN
                SHIFT_LEFT_CLICK: SEAT_SELECTION
        floating:
            switch-parameters:
                velocity:
                    y: -0.8,0.8
            animations:
                default:
                    - regular
                forward:
                    - forward
                backward:
                    - backward
                right:
                    - right
                left:
                    - left
            keybinds:
                W: THROTTLE_UP
                SPACE_W: THROTTLE_UP
                SHIFT_W: THROTTLE_UP
                S: THROTTLE_DOWN
                SPACE_S: THROTTLE_DOWN
                SHIFT_S: THROTTLE_DOWN
                A: TURN_LEFT
                SPACE_A: TURN_LEFT
                SHIFT_A: TURN_LEFT
                D: TURN_RIGHT
                SPACE_D: TURN_RIGHT
                SHIFT_D: TURN_RIGHT
                SPACE: UP
                SHIFT_LEFT_CLICK: SEAT_SELECTION
        ground:
            switch-parameters:
                velocity:
                    y: -0.5,0.5
            animations:
                forward:
                    - forward
                backward:
                    - backward
            keybinds:
                W: THROTTLE_UP
                SPACE_W: THROTTLE_UP
                S: THROTTLE_DOWN
                SPACE_S: THROTTLE_DOWN
                SPACE: UP
                SHIFT_LEFT_CLICK: SEAT_SELECTION
    components:
        engine:
            sounds:
                steam_engine:
                    sound: "vehicleframework:steam_engine"
                    pitched: true
                    pitch: 1.0
                    volume: 6.0
                water_move:
                    sound: "vehicleframework:ship_water_move"
                    pitch: 1.0
                    volume: 4.0
            particles:
                    exhaust:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 4
                        spread: 0.3
                        speed: 0.04
            particle-bones:
                - exhaust.exhaustalign
                - exhaust2.exhaustalign2
            health: 180.0
            repair-time: 60
            fuel-burn-rate: 1
            fuel: arcane_fuel
            fuel-capacity: 1800
            refuel-states:
                - GROUND
            damage-chance: 0.7
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.3)
                - bullet(1.1)
                - entity_explosion(2.0)
                - small_bomb(10.0)
                - cannonball(1.8)
                - torpedo(7.0)
                - flak_bullet(2.0)
            max: 100
            min: -20
            speed: 0.37
            turn-rate: 0.24
            vfx:
                - enginefire1
        hull:
            health: 290.0
            repair-time: 100
            damage-chance: 1.0
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.3)
                - bullet(0.2)
                - entity_explosion(2.0)
                - small_bomb(10.0)
                - cannonball(1.8)
                - torpedo(7.0)
                - flak_bullet(2.0)
            vfx:
                - hull_vfx
                - hull_vfx2
                - hull_vfx3
        balloon:
            health: 240.0
            repair-time: 160
            damage-chance: 1.0
            lift: 0.2
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.3)
                - bullet(0.9)
                - entity_explosion(2.0)
                - small_bomb(10.0)
                - cannonball(1.8)
                - torpedo(7.0)
                - flak_bullet(2.0)
            vfx:
                - balloon
    seats:
        - captain(captain)
        - mechanic(mechanic)
        - passenger(aa_turret_gunner)
        - passenger(bombardier)
        - passenger(passenger)
    weapons:
        aa_turret:
            name: "§eAnti-Air Turret"
            seat: aa_turret_gunner
            body-bone: "aa_turret_body"
            head-bone: "gun"
            head-axis: x
            rotation-limits:
              min-pitch: -85
              max-pitch: 20
            reload-time: 10
            cooldown: 10
            accepted-ammunition:
                - bullet
            animations:
                shoot:
                    - shoot
                    - shoot2
            bones:
                - exit1.exit_align1
                - exit2.exit_align2
            data:
                shoot-sounds:
                    sound:
                        sound: "minecraft:guns.musket_1"
                        pitch: 1.0
                        volume: 6.0
                reload-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
                reload-start-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
                particles:
                    particle1:
                        particle: FLAME
                        amount: 4
                        spread: 0.1
                        speed: 1.2
            keybinds:
                W: WEAPON_UP
                S: WEAPON_DOWN
                A: WEAPON_LEFT
                D: WEAPON_RIGHT
                SPACE_W: WEAPON_UP
                SPACE_S: WEAPON_DOWN
                SPACE_A: WEAPON_LEFT
                SPACE_D: WEAPON_RIGHT
                RIGHT_CLICK: WEAPON_RELOAD
                SPACE: WEAPON_SHOOT
        bomb_bay:
            name: "§eBomb Bay"
            seat: bombardier
            fixed: true
            reload-time: 5
            cooldown: 10
            reload-states:
                - GROUND
            accepted-ammunition:
                - small_bomb_rack
            bones:
                - bomb_bay.bomb_bay_align
            data:
                shoot-sounds:
                    sound:
                        sound: "vehicleframework:clank"
                        pitch: 1.0
                        volume: 3.0
                reload-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
                reload-start-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
            keybinds:
                RIGHT_CLICK: WEAPON_RELOAD #WEAPON_RELOAD_AND_SHOOT
                SPACE: WEAPON_SHOOT
                LEFT_CLICK: WEAPON_SWITCH