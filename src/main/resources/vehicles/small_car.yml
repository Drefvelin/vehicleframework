small_car:
    name: "§l§eSmall Car"
    model: small_car
    skins:
        small_car:
            name: "Small Car"
            model: small_car
    death:
        explode:
            fragments: 10
            duration: 320
            sounds:
                explode:
                    sound: "vehicleframework:explosion"
                    pitch: 1.0
                    volume: 8.0
    behaviour:
        turn-scaling: false
        rotator: body_controller
        vector: move.movealign
    states:
        ground:
            terrain-follow: true
            step-height: 1
            ground-probes:
              - ground_fl
              - ground_fr
              - ground_bl
              - ground_br
            climb: 1
            animations:
                forward:
                    - forward
                backward:
                    - backward
                left:
                    - left
                right:
                    - right
            keybinds:
                W: THROTTLE_UP
                S: THROTTLE_DOWN
                A: TURN_LEFT
                D: TURN_RIGHT
                LEFT_CLICK: HORN
                SHIFT: SEAT_SELECTION
                SPACE: LIGHTS
    utilities:
        lights:
            headlight1:
                vector: light1.lightalign1
                falloff: 1
                power: 8
            headlight2:
                vector: light2.lightalign2
                falloff: 1
                power: 8
        horn:
            sound: "vehicleframework:car_horn"
            pitch: 1.0
            volume: 1.0
    custom-effects:
        engine_start:
            - sound(move;vehicleframework:car_engine_start;3.0;1.0)
            - delay(20)
        engine_stop:
            - sound(move;vehicleframework:car_engine_stop;3.0;1.0)
    components:
        geared_engine:
            gears:
                reverse:
                    name: "Reverse"
                    engine-sound:
                        sound: "vehicleframework:car_engine_1"
                        pitched: true
                        max-pitch: 1.0
                        min-pitch: 0.85
                        pitch: 1.0
                        volume: 3.0
                    accelerate-sound:
                        sound: "vehicleframework:car_engine_rev_1"
                        pitch: 1.0
                        volume: 3.0
                    max: 0
                    min: -20
                    acceleration: 2
                    speed: 0.4
                first:
                    name: "First"
                    engine-sound:
                        sound: "vehicleframework:car_engine_1"
                        pitched: true
                        max-pitch: 1.0
                        min-pitch: 0.85
                        pitch: 1.0
                        volume: 3.0
                    accelerate-sound:
                        sound: "vehicleframework:car_engine_rev_1"
                        pitch: 1.0
                        volume: 3.0
                    max: 40
                    min: 0
                    acceleration: 3
                    speed: 0.4
                second:
                    name: "Second"
                    engine-sound:
                        sound: "vehicleframework:car_engine_2"
                        pitched: true
                        max-pitch: 1.0
                        min-pitch: 0.85
                        pitch: 1.0
                        volume: 3.0
                    accelerate-sound:
                        sound: "vehicleframework:car_engine_rev_2"
                        pitch: 1.0
                        volume: 3.0
                    max: 75
                    min: 40
                    acceleration: 2
                    speed: 0.55
                third:
                    name: "Third"
                    engine-sound:
                        sound: "vehicleframework:car_engine_2"
                        pitched: true
                        max-pitch: 1.0
                        min-pitch: 0.85
                        pitch: 1.0
                        volume: 3.0
                    accelerate-sound:
                        sound: "vehicleframework:car_engine_rev_2"
                        pitch: 1.0
                        volume: 3.0
                    max: 100
                    min: 75
                    acceleration: 1
                    speed: 0.65
            particles:
                dust:
                    particle: SMOKE_NORMAL
                    amount: 2
                    spread: 0.01
                    speed: 0.01
            particle-bones:
                - dust1.dustalign1
                - dust2.dustalign2
                - dust3.dustalign3
                - dust4.dustalign4
            alias: "Engine"
            requires-start: true
            start-gear: 1
            health: 200.0
            repair-time: 60
            fuel-burn-rate: 1
            fuel: arcane_fuel
            fuel-capacity: 500
            damage-chance: 0.7
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.2)
                - bullet(0.6)
                - entity_explosion(1.5)
                - small_bomb(6.0)
                - cannonball(1.3)
                - torpedo(5.0)
            turn-rate: 0.7
            vfx:
                - body
        hull:
            health: 150.0
            repair-time: 100
            damage-chance: 1.0
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.2)
                - bullet(0.6)
                - entity_explosion(1.5)
                - small_bomb(3.0)
                - cannonball(1.3)
            vfx:
                - body
    seats:
        - captain(driver)