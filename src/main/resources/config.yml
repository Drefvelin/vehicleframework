##Won't be blown up
ignore-explosion:
    - WATER
    - LAVA
    - SHORT_GRASS
    - FERN
    - TALL_GRASS
    - LARGE_FERN
    - LIGHT
##Won't land and become a full block again
ignore-landing:
    - GRASS_BLOCK
    - OAK_LEAVES
    - SPRUCE_LEAVES
    - BIRCH_LEAVES
    - ACACIA_LEAVES
    - MANGROVE_LEAVES
    - JUNGLE_LEAVES
    - DARK_OAK_LEAVES
    - AZALEA_LEAVES
    - FLOWERING_AZALEA_LEAVES
###Converts blocks in explosions
convert-explosion:
    - GRASS_BLOCK.DIRT
    - STONE_BRICKS.CRACKED_STONE_BRICKS
    - STONE.COBBLESTONE
## Falling debris will not rest on these
ignore-ground:
    - GRASS
    - TALL_GRASS
    - FERN
    - LARGE_FERN
    - DEAD_BUSH
    - SEAGRASS
    - TALL_SEAGRASS
    - AZALEA
    - FLOWERING_AZALEA
    - MOSS_CARPET
    - VINE
    - GLOW_LICHEN
    - CAVE_VINES
    - CAVE_VINES_PLANT
    - TWISTING_VINES
    - TWISTING_VINES_PLANT
    - WEEPING_VINES
    - WEEPING_VINES_PLANT
    - OAK_LEAVES
    - SPRUCE_LEAVES
    - BIRCH_LEAVES
    - JUNGLE_LEAVES
    - ACACIA_LEAVES
    - DARK_OAK_LEAVES
    - MANGROVE_LEAVES
    - AZALEA_LEAVES
    - FLOWERING_AZALEA_LEAVES
    - WATER
    - LAVA
    - CARPET
    - SNOW
    - TORCH
    - SOUL_TORCH
    - REDSTONE_TORCH
    - REDSTONE_WIRE
    - RAIL
    - POWERED_RAIL
    - DETECTOR_RAIL
    - ACTIVATOR_RAIL
    - LADDER
    - SCAFFOLDING
    - WHEAT
    - CARROTS
    - POTATOES
    - BEETROOTS
    - MELON_STEM
    - PUMPKIN_STEM
    - NETHER_WART
    - COCOA
    - SWEET_BERRY_BUSH
    - LIGHT
    - BARRIER
    - AIR

##Should we log when people enter the captains seat of a vehicle?
enable-logging: true

##How far away does the player need to be for the vehicle to despawn?
despawn-distance: 160

##Explosion Damage
block-damage: true

##Items, supports TLibs paths for MMOItems and ItemsAdder
repair-item: m.utils.vehicle_repair
skin-item: m.utils.vehicle_skin
destroy-item: v.blaze_rod
ticket-item: v.paper

##Can players set up whitelists for their vehicle
allow-whitelist: true
whitelisted-by-default: true

## At 0% weapon health, reload takes this many times longer than at 100% (linear scale)
weapon-degraded-reload-multiplier: 2.0

## Show a particle at the resolved cursor aim target for the gunner (debug tuning)
weapon-aim-debug: false

## Show END_ROD particles at terrain-follow probe starts and ground hits
terrain-follow-debug: false

## Append each terrain-follow step to plugins/VehicleFramework/logs/ground_engine.log
ground-engine-logging: false
## When true, ground_engine.log is deleted on every plugin start/reload.
wipe-log: false

##Set this to the ID of the MythicMob, in the free pack this is VehicleFrameworkDummy
##You can leave it as "none" if you do not have MythicMobs on your server
mythicmob: "none"
