anti_air:
    name: "§l§eAnti-Air"
    model: anti_air
    fixed: true
    skins:
        anti_air:
            name: "Anti-Air"
            model: anti_air
    death:
        explode:
            fragments: 4
            duration: 320
            sounds:
                explode:
                    sound: "vehicleframework:explosion"
                    pitch: 1.0
                    volume: 8.0
    behaviour:
        rotator: body
        vector: body.body
    states:
        ground:
            keybinds:
                SHIFT: SEAT_SELECTION
    components:
        hull:
            health: 50.0
            repair-time: 100
            damage-chance: 1.0
            damage:
                - entity_attack(0.1)
                - projectile(0.3)
                - entity_explosion(1.3)
                - bullet(0.4)
                - torpedo(0.2)
                - small_bomb(3.0)
                - cannonball(2.0)
                - flak_bullet(0.2)
            vfx:
                - body
    seats:
        - captain(gunner)
    weapons:
        flak_cannon:
            name: "§eFlak Cannon"
            seat: gunner
            body-bone: "body"
            head-bone: "gun_rotator"
            head-axis: x
            rotation-limits:
              min-pitch: -85
              max-pitch: 0
            reload-time: 10
            cooldown: 15
            accepted-ammunition:
                - flak_bullet
            bones:
                - exit.exitalign
            animations:
                shoot:
                    - shoot
            data:
                shoot-sounds:
                    sound:
                        sound: "minecraft:guns.musket_1"
                        pitch: 1.0
                        volume: 6.0
                reload-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
                reload-start-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
                particles:
                    particle1:
                        particle: FLAME
                        amount: 6
                        spread: 0.1
                        speed: 1.2
                    particle2:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 6
                        spread: 0.6
                        speed: 0.2
                    particle3:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 4
                        spread: 0.2
                        speed: 0.4
            keybinds:
                W: WEAPON_DOWN
                S: WEAPON_UP
                A: WEAPON_LEFT
                D: WEAPON_RIGHT
                SPACE_W: WEAPON_DOWN
                SPACE_S: WEAPON_UP
                SPACE_A: WEAPON_LEFT
                SPACE_D: WEAPON_RIGHT
                RIGHT_CLICK: WEAPON_RELOAD
                SPACE: WEAPON_SHOOT