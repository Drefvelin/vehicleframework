cruiser:
    name: "§l§eCruiser"
    model: cruiser
    skins:
        cruiser:
            name: "Cruiser"
            model: cruiser
    death:
        explode:
            fragments: 30
            duration: 320
            sounds:
                sink:
                    sound: "vehicleframework:ship_sinking"
                    pitch: 1.0
                    volume: 5.0
                explode:
                    sound: "vehicleframework:explosion"
                    pitch: 1.0
                    volume: 8.0
        sink:
            duration: 320
            sounds:
                sink:
                    sound: "vehicleframework:ship_sinking"
                    pitch: 1.0
                    volume: 5.0
    behaviour:
        rotator: body_controller
        vector: move.movealign
        float: true
        float-in:
            - WATER
            - KELP
    states:
        floating:
            animations:
                default:
                    - float
                explode:
                    - explode
                sink:
                    - sink
                right:
                    - turn_right
                left:
                    - turn_left
            keybinds:
                W: THROTTLE_UP
                S: THROTTLE_DOWN
                A: TURN_LEFT
                D: TURN_RIGHT
                SHIFT: SEAT_SELECTION
    components:
        engine:
            sounds:
                steam_engine:
                    sound: "vehicleframework:steam_engine"
                    pitched: true
                    pitch: 1.0
                    volume: 6.0
                water_move:
                    sound: "vehicleframework:ship_water_move"
                    pitch: 1.0
                    volume: 4.0
            particles:
                    exhaust:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 10
                        spread: 0.3
                        speed: 0.2
            particle-bones:
                - exhaust.exhaustalign
                - exhaust2.exhaustalign2
            requires-start: true
            health: 500.0
            repair-time: 60
            fuel-burn-rate: 10
            fuel: coal
            fuel-capacity: 2400
            damage-chance: 0.7
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.2)
                - bullet(0.6)
                - entity_explosion(1.5)
                - small_bomb(6.0)
                - cannonball(1.3)
                - torpedo(5.0)
            max: 100
            min: -10
            speed: 0.22
            turn-rate: 0.14
            vfx:
                - engine_vfx_1
                - engine_vfx_2
                - engine_vfx_3
        hull:
            sinkable: true
            health: 800.0
            repair-time: 100
            damage-chance: 1.0
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.1)
                - bullet(0.1)
                - entity_explosion(1.5)
                - small_bomb(6.0)
                - cannonball(1.3)
                - torpedo(5.0)
            vfx:
                - hull_vfx_1
                - hull_vfx_2
                - hull_vfx_3
        pump:
            health: 150.0
            repair-time: 40
            damage-chance: 0.4
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.7)
                - bullet(0.7)
                - entity_explosion(1.5)
                - small_bomb(10.0)
                - cannonball(1.3)
                - torpedo(5.0)
            power: 50
            vfx:
                - pump_vfx_1
                - pump_vfx_2
    seats:
        - captain(captain)
        - mechanic(first_mate)
        - mechanic(deck_officer)
        - passenger(front_turret_gunner)
        - passenger(back_turret_gunner)
        - passenger(aa_turret_gunner_left)
        - passenger(aa_turret_gunner_right)
        - mechanic(mechanic_1)
        - mechanic(mechanic_2)
        - passenger(passenger_1)
        - passenger(passenger_2)
        - passenger(passenger_3)
        - passenger(passenger_4)
        - passenger(passenger_5)
        - passenger(passenger_6)
        - passenger(passenger_7)
        - passenger(passenger_8)
    weapons:
        front_turret:
            name: "§eFront Turret"
            seat: front_turret_gunner
            body-bone: "body"
            head-bone: "gun_front"
            head-axis: z
            rotation-limits:
              min-roll: -20
              max-roll: 35
            reload-time: 5
            accepted-ammunition:
                - cannonball
                - clusterbomb
            bones:
                - exit.exitalign
            animations:
                shoot:
                    - shoot_front
            data:
                shoot-sounds:
                    sound:
                        sound: "minecraft:entity.generic.explode"
                        pitch: 1.0
                        volume: 6.0
                reload-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
                reload-start-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
                particles:
                    particle1:
                        particle: FLAME
                        amount: 100
                        spread: 0.3
                        speed: 1.2
                    particle2:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 100
                        spread: 1.4
                        speed: 0.2
                    particle3:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 50
                        spread: 0.7
                        speed: 0.4
            keybinds:
                W: WEAPON_UP
                S: WEAPON_DOWN
                A: WEAPON_LEFT
                D: WEAPON_RIGHT
                SPACE_W: WEAPON_UP
                SPACE_S: WEAPON_DOWN
                SPACE_A: WEAPON_LEFT
                SPACE_D: WEAPON_RIGHT
                RIGHT_CLICK: WEAPON_RELOAD
                SPACE: WEAPON_SHOOT
        back_turret:
            name: "§eBack Turret"
            seat: back_turret_gunner
            body-bone: "body2"
            head-bone: "gun_back"
            head-axis: z
            rotation-limits:
              min-roll: -20
              max-roll: 35
            reload-time: 5
            accepted-ammunition:
                - cannonball
                - clusterbomb
            bones:
                - exit5.exit5align
            animations:
                shoot:
                    - shoot_back
            data:
                shoot-sounds:
                    sound:
                        sound: "minecraft:entity.generic.explode"
                        pitch: 1.0
                        volume: 6.0
                reload-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
                reload-start-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
                particles:
                    particle1:
                        particle: FLAME
                        amount: 100
                        spread: 0.3
                        speed: 1.2
                    particle2:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 100
                        spread: 1.4
                        speed: 0.2
                    particle3:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 50
                        spread: 0.7
                        speed: 0.4
            keybinds:
                W: WEAPON_UP
                S: WEAPON_DOWN
                A: WEAPON_LEFT
