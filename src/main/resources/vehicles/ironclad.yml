ironclad:
    name: "§l§eIronclad"
    model: ironclad
    skins:
        ironclad:
            name: "Ironclad"
            model: ironclad
    death:
        template: ship
    behaviour:
        rotator: body_controller
        vector: move.movealign
        float: true
        float-in:
            - WATER
            - KELP
    states:
        floating:
            animations:
                default:
                    - float
                explode:
                    - explode
                sink:
                    - sink
                right:
                    - turn_right
                left:
                    - turn_left
            keybinds:
                W: THROTTLE_UP
                S: THROTTLE_DOWN
                A: TURN_LEFT
                D: TURN_RIGHT
                SHIFT: SEAT_SELECTION
    components:
        engine:
            sounds:
                steam_engine:
                    sound: "vehicleframework:steam_engine"
                    pitched: true
                    pitch: 1.0
                    volume: 6.0
                water_move:
                    sound: "vehicleframework:ship_water_move"
                    pitch: 1.0
                    volume: 4.0
            particles:
                    exhaust:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 10
                        spread: 0.3
                        speed: 0.2
            particle-bones:
                - exhaust.exhaustalign
            requires-start: true
            health: 200.0
            repair-time: 60
            fuel-burn-rate: 5
            fuel: coal
            fuel-capacity: 1200
            damage-chance: 0.7
            armor: armored
            role: engine_armored
            max: 100
            min: -10
            speed: 0.3
            turn-rate: 0.2
            vfx:
                - engine_vfx_1
                - engine_vfx_2
                - engine_vfx_3
        hull:
            sinkable: true
            health: 400.0
            repair-time: 100
            damage-chance: 1.0
            armor: armored
            role: hull_armored
            vfx:
                - hull_vfx_1
                - hull_vfx_2
                - hull_vfx_3
        pump:
            health: 80.0
            repair-time: 40
            damage-chance: 0.4
            armor: armored
            role: pump_armored
            power: 50
            vfx:
                - pump_vfx_1
                - pump_vfx_2
    seats:
        - captain(captain)
        - mechanic(first_mate)
        - mechanic(deck_officer)
        - passenger(gunner)
        - passenger(aa_turret_gunner)
        - mechanic(front_middle)
        - passenger(front_left)
        - passenger(front_right)
        - mechanic(middle_right)
        - mechanic(middle_left)
        - passenger(back_right)
        - passenger(back_left)
    weapons:
        large_cannon:
            name: "§eFront Cannon"
            template: naval_cannon
            seat: gunner
            body-bone: "weapon_body"
            head-bone: "cannon_controller"
            head-axis: z
            rotation-limits:
              min-yaw: -120
              max-yaw: 120
              min-roll: -15
              max-roll: 75
            cooldown: 8
            projectile-damage: 28
            projectile-yield: 2.7
            projectile-radius: 10
            accepted-ammunition:
                - cannonball
                - clusterbomb
            animations:
                reload:
                    - weapon_reload
                shoot:
                    - weapon_shoot
            bones:
                - exit.exit_align
        aa_turret:
            name: "§eAnti-Air Turret"
            template: aa_turret
            seat: aa_turret_gunner
            body-bone: "aa_turret_body"
            head-bone: "gun"
            rotation-limits:
              min-pitch: -85
              max-pitch: 0
            animations:
                shoot:
                    - shoot
                    - shoot2
            bones:
                - exit1.exit_align1
                - exit2.exit_align2
            keybinds:
                W: WEAPON_UP
                S: WEAPON_DOWN
                SPACE_W: WEAPON_UP
                SPACE_S: WEAPON_DOWN