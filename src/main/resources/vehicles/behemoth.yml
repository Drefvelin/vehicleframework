behemoth:
    name: "§l§eBehemoth"
    model: behemoth
    skins:
        behemoth:
            name: "Behemoth"
            model: behemoth
    death:
        template: explode_large
    behaviour:
        rotator: body_controller
        vector: move.movealign
        float: true
        float-in:
            - WATER
            - KELP
    containers:
        cargo_hold_1:
            seat: passenger_1
            name: "§eCargo Hold 1"
            size: 54
        cargo_hold_2:
            seat: passenger_2
            name: "§eCargo Hold 2"
            size: 54
        cargo_hold_3:
            seat: passenger_3
            name: "§eCargo Hold 3"
            size: 54
        cargo_hold_4:
            seat: passenger_4
            name: "§eCargo Hold 4"
            size: 54
    utilities:
        horn:
            sound: "vehicleframework:big_horn"
            pitch: 1.0
            volume: 16.0
    states:
        flying:
            animations:
                default:
                    - regular
                forward:
                    - forward
                backward:
                    - backward
                right:
                    - right
                left:
                    - left
            keybinds:
                W: THROTTLE_UP
                SPACE_W: THROTTLE_UP
                SHIFT_W: THROTTLE_UP
                S: THROTTLE_DOWN
                SPACE_S: THROTTLE_DOWN
                SHIFT_S: THROTTLE_DOWN
                A: TURN_LEFT
                SPACE_A: TURN_LEFT
                SHIFT_A: TURN_LEFT
                D: TURN_RIGHT
                SPACE_D: TURN_RIGHT
                SHIFT_D: TURN_RIGHT
                SPACE: UP
                SHIFT: DOWN
                SHIFT_LEFT_CLICK: SEAT_SELECTION
                LEFT_CLICK: HORN
        floating:
            switch-parameters:
                velocity:
                    y: -0.8,0.8
            animations:
                default:
                    - regular
                forward:
                    - forward
                backward:
                    - backward
                right:
                    - right
                left:
                    - left
            keybinds:
                W: THROTTLE_UP
                SPACE_W: THROTTLE_UP
                SHIFT_W: THROTTLE_UP
                S: THROTTLE_DOWN
                SPACE_S: THROTTLE_DOWN
                SHIFT_S: THROTTLE_DOWN
                A: TURN_LEFT
                SPACE_A: TURN_LEFT
                SHIFT_A: TURN_LEFT
                D: TURN_RIGHT
                SPACE_D: TURN_RIGHT
                SHIFT_D: TURN_RIGHT
                SPACE: UP
                SHIFT_LEFT_CLICK: SEAT_SELECTION
        ground:
            switch-parameters:
                velocity:
                    y: -0.5,0.5
            animations:
                forward:
                    - forward
                backward:
                    - backward
            keybinds:
                W: THROTTLE_UP
                SPACE_W: THROTTLE_UP
                S: THROTTLE_DOWN
                SPACE_S: THROTTLE_DOWN
                SPACE: UP
                SHIFT_LEFT_CLICK: SEAT_SELECTION
    components:
        engine:
            sounds:
                steam_engine:
                    sound: "vehicleframework:steam_engine"
                    pitched: true
                    pitch: 1.0
                    volume: 6.0
                water_move:
                    sound: "vehicleframework:ship_water_move"
                    pitch: 1.0
                    volume: 4.0
            particles:
                    exhaust:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 4
                        spread: 0.3
                        speed: 0.04
            particle-bones:
                - exhaust.exhaustalign
                - exhaust2.exhaustalign2
                - exhaust3.exhaustalign3
                - exhaust4.exhaustalign4
            health: 580.0
            repair-time: 100
            fuel-burn-rate: 12
            fuel: arcane_fuel
            fuel-capacity: 16000
            refuel-states:
                - GROUND
            damage-chance: 0.7
            armor: airship
            role: engine_airship
            damage:
                bullet: 1.5
                flak_bullet: 5.0
            max: 100
            min: -20
            speed: 0.27
            turn-rate: 0.16
            vfx:
                - engine_vfx_1
                - engine_vfx_2
                - engine_vfx_3
        hull:
            health: 1150.0
            repair-time: 160
            damage-chance: 1.0
            armor: airship
            role: hull_airship
            damage:
                bullet: 0.7
                flak_bullet: 3.0
            vfx:
                - hull_vfx_1
                - hull_vfx_2
        balloon:
            health: 2000.0
            repair-time: 200
            damage-chance: 1.0
            lift: 0.2
            armor: airship
            role: balloon_light
            damage:
                bullet: 2.0
                flak_bullet: 3.0
            vfx:
                - balloon_vfx_1
                - balloon_vfx_2
    seats:
        - captain(captain)
        - mechanic(mechanic_1)
        - mechanic(mechanic_2)
        - passenger(front_gunner)
        - passenger(cannoneer_left)
        - passenger(cannoneer_right)
        - passenger(aa_turret_gunner_1)
        - passenger(aa_turret_gunner_2)
        - passenger(aa_turret_gunner_3)
        - passenger(aa_turret_gunner_4)
        - passenger(passenger_1)
        - passenger(passenger_2)
        - passenger(passenger_3)
        - passenger(passenger_4)
        - passenger(passenger_5)
        - passenger(passenger_6)
    weapons:
        autocannon:
            name: "§eFront Cannon"
            template: autocannon
            seat: front_gunner
            body-bone: "autocannon"
            head-bone: "autocannon_rotator"
            rotation-limits:
              min-yaw: -50
              max-yaw: 50
              min-pitch: -10
              max-pitch: 85
            animations:
                shoot:
                    - ac_shoot2
                    - ac_shoot
            bones:
                - acexit.acexitalign
                - acexit2.acexitalign2
        left_cannon:
            name: "§eLeft Cannon"
            template: naval_cannon
            seat: cannoneer_left
            body-bone: "cannon"
            head-bone: "gun_rotator"
            head-axis: z
            rotation-limits:
              min-yaw: -60
              max-yaw: 60
              min-roll: -50
              max-roll: 40
            cooldown: 12
            projectile-damage: 36
            projectile-yield: 3.5
            projectile-radius: 12
            projectile-cluster-amount: 26
            accepted-ammunition:
                - cannonball
                - clusterbomb
            animations:
                shoot:
                    - shoot1
            bones:
                - cannonexit.cannonexitalign
        right_cannon:
            name: "§eRight Cannon"
            template: naval_cannon
            seat: cannoneer_right
            body-bone: "cannon2"
            head-bone: "gun_rotator2"
            head-axis: z
            rotation-limits:
              min-yaw: -60
              max-yaw: 60
              min-roll: -50
              max-roll: 40
            cooldown: 12
            projectile-damage: 36
            projectile-yield: 3.5
            projectile-radius: 12
            projectile-cluster-amount: 26
            accepted-ammunition:
                - cannonball
                - clusterbomb
            animations:
                shoot:
                    - shoot2
            bones:
                - cannonexit2.cannonexitalign2
        aa_turret_1:
            name: "§eAnti-Air Turret 1"
            template: aa_turret
            seat: aa_turret_gunner_1
            body-bone: "aa_turret_body"
            head-bone: "gun"
            rotation-limits:
              min-pitch: -85
              max-pitch: 0
            animations:
                shoot:
                    - aa_shoot
                    - aa_shoot2
            bones:
                - exit1.exit_align1
                - exit2.exit_align2
            keybinds:
                W: WEAPON_UP
                S: WEAPON_DOWN
                SPACE_W: WEAPON_UP
                SPACE_S: WEAPON_DOWN
        aa_turret_2:
            name: "§eAnti-Air Turret 2"
            template: aa_turret
            seat: aa_turret_gunner_2
            body-bone: "aa_turret_body2"
            head-bone: "gun2"
            rotation-limits:
              min-pitch: -85
              max-pitch: 0
            animations:
                shoot:
                    - aa_shoot3
                    - aa_shoo4
            bones:
                - exit3.exit_align3
                - exit4.exit_align4
            keybinds:
                W: WEAPON_UP
                S: WEAPON_DOWN
                SPACE_W: WEAPON_UP
                SPACE_S: WEAPON_DOWN
        aa_turret_3:
            name: "§eAnti-Air Turret 3"
            template: aa_turret
            seat: aa_turret_gunner_3
            body-bone: "aa_turret_body3"
            head-bone: "gun3"
            rotation-limits:
              min-pitch: -85
              max-pitch: 0
            animations:
                shoot:
                    - aa_shoot7
                    - aa_shoot8
            bones:
                - exit5.exit_align5
                - exit6.exit_align6
            keybinds:
                W: WEAPON_UP
                S: WEAPON_DOWN
                SPACE_W: WEAPON_UP
                SPACE_S: WEAPON_DOWN
        aa_turret_4:
            name: "§eAnti-Air Turret 4"
            template: aa_turret
            seat: aa_turret_gunner_4
            body-bone: "aa_turret_body4"
            head-bone: "gun4"
            rotation-limits:
              min-pitch: -85
              max-pitch: 0
            animations:
                shoot:
                    - aa_shoot5
                    - aa_shoot6
            bones:
                - exit7.exit_align7
                - exit8.exit_align8
            keybinds:
                W: WEAPON_UP
                S: WEAPON_DOWN
                SPACE_W: WEAPON_UP
                SPACE_S: WEAPON_DOWN