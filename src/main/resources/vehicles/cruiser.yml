                SPACE_W: WEAPON_UP
                SPACE_S: WEAPON_DOWN
                SPACE_A: WEAPON_LEFT
                SPACE_D: WEAPON_RIGHT
                RIGHT_CLICK: WEAPON_RELOAD
                SPACE: WEAPON_SHOOT
