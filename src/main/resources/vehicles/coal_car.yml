coal_car:
    name: "§l§eCoal Car"
    model: coal_car
    fixed: true
    skins:
        coal_car:
            name: "Coal Car"
            model: coal_car
    death:
        explode:
            fragments: 4
            duration: 320
            sounds:
                explode:
                    sound: "vehicleframework:explosion"
                    pitch: 1.0
                    volume: 8.0
    behaviour:
        rotator: body
        vector: move.movealign
        tracked: true
        train:
            front-connector: connector_front
            back-connector: connector_back
    states:
        ground:
            animations:
                forward:
                    - forward
                backward:
                    - backward
            keybinds:
                SHIFT: SEAT_SELECTION
    seats:
        - passenger(passenger)
    containers:
        bunker:
            seat: passenger
            name: "§eCoal Bunker"
            size: 27
            allow-items:
                - v.coal_block
    components:
        hull:
            health: 30.0
            repair-time: 100
            damage-chance: 1.0
            damage:
                - entity_attack(0.1)
                - projectile(0.3)
                - entity_explosion(1.3)
                - bullet(0.4)
                - torpedo(0.2)
                - small_bomb(3.0)
                - cannonball(2.0)
            vfx:
                - body