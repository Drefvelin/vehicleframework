torpedoboat:
    name: "§l§eTorpedoboat"
    model: torpedoboat
    skins:
        torpedoboat:
            name: "Torpedoboat"
            model: torpedoboat
    death:
        template: ship
    behaviour:
        rotator: body_controller
        vector: move.movealign
        float: true
        float-in:
            - WATER
            - KELP
    states:
        floating:
            animations:
                default:
                    - float
                explode:
                    - explode
                sink:
                    - sink
                right:
                    - right
                left:
                    - left
            keybinds:
                W: THROTTLE_UP
                S: THROTTLE_DOWN
                A: TURN_LEFT
                D: TURN_RIGHT
                SHIFT: SEAT_SELECTION
    components:
        engine:
            sounds:
                steam_engine:
                    sound: "vehicleframework:steam_engine"
                    pitched: true
                    pitch: 1.0
                    volume: 6.0
                water_move:
                    sound: "vehicleframework:ship_water_move"
                    pitch: 1.0
                    volume: 4.0
            particles:
                    exhaust:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 10
                        spread: 0.3
                        speed: 0.2
            particle-bones:
                - exhaust.exhaustalign
            requires-start: true
            health: 200.0
            repair-time: 60
            fuel-burn-rate: 2
            fuel: coal
            fuel-capacity: 600
            damage-chance: 0.7
            armor: armored
            role: engine_armored
            max: 100
            min: -10
            speed: 0.4
            turn-rate: 0.35
            vfx:
                - engine_vfx_1
                - engine_vfx_2
                - engine_vfx_3
        hull:
            sinkable: true
            health: 400.0
            repair-time: 100
            damage-chance: 1.0
            armor: armored
            role: hull_armored
            damage:
                bullet: 0.2
            vfx:
                - hull_vfx_1
                - hull_vfx_2
        pump:
            health: 80.0
            repair-time: 40
            damage-chance: 0.4
            armor: armored
            role: pump_armored
            damage:
                projectile: 0.4
                bullet: 0.6
            power: 50
            vfx:
                - pump_vfx_1
    seats:
        - captain(captain)
        - passenger(gunner)
        - mechanic(mechanic)
    weapons:
        torpedo_launcher:
            name: "§eTorpedo Launcher"
            seat: gunner
            fixed: true
            reload-time: 5
            accepted-ammunition:
                - torpedo
            bones:
                - exit.exitalign
            data:
                shoot-sounds:
                    sound:
                        sound: "minecraft:entity.generic.explode"
                        pitch: 1.0
                        volume: 6.0
                reload-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
                reload-start-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
                particles:
                    particle1:
                        particle: FLAME
                        amount: 100
                        spread: 0.3
                        speed: 1.2
                    particle2:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 100
                        spread: 1.4
                        speed: 0.2
                    particle3:
                        particle: CAMPFIRE_COSY_SMOKE
                        amount: 50
                        spread: 0.7
                        speed: 0.4
            keybinds:
                RIGHT_CLICK: WEAPON_RELOAD
                SPACE: WEAPON_SHOOT