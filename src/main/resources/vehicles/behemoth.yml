        - captain(captain)
        - mechanic(mechanic_1)
        - mechanic(mechanic_2)
        - passenger(front_gunner)
        - passenger(cannoneer_left)
        - passenger(cannoneer_right)
        - passenger(aa_turret_gunner_1)
        - passenger(aa_turret_gunner_2)
        - passenger(aa_turret_gunner_3)
        - passenger(aa_turret_gunner_4)
        - passenger(passenger_1)
        - passenger(passenger_2)
        - passenger(passenger_3)
        - passenger(passenger_4)
        - passenger(passenger_5)
        - passenger(passenger_6)
