biplane:
    name: "§l§eBiplane"
    model: biplane
    skins:
        biplane:
            name: "Biplane"
            model: biplane
        biplane_black:
            name: "Biplane (Black)"
            model: biplane_black
        biplane_chinese:
            name: "Biplane (Yellow)"
            model: biplane_chinese
        biplane_purple:
            name: "Biplane (Purple Imvata)"
            model: biplane_purple
        biplane_revenor:
            name: "Biplane (Revenor)"
            model: biplane_revenor
        biplane_domenia:
            name: "Biplane (Domenia)"
            model: biplane_domenia
        biplane_sabarissa:
            name: "Biplane (Sabarissa)"
            model: biplane_sabarissa
        biplane_sabarissa_brown:
            name: "Biplane (Brown)"
            model: biplane_sabarissa_brown
        biplane_pirate:
            name: "Biplane (Pirate)"
            model: biplane_pirate
        biplane_prism:
            name: "Biplane (Prism)"
            model: biplane_prism
        biplane_norain:
            name: "Biplane (Norain)"
            model: biplane_norain
        biplane_zerratoris:
            name: "Biplane (Zerratoris)"
            model: biplane_zerratoris
        biplane_oseni:
            name: "Biplane (Oseni)"
            model: biplane_oseni
    death:
        template: explode_medium
        explode:
            overrides:
                crashing:
                    type: crash
                    conditions:
                        - state(flying)
        crash:
            nop: true
    behaviour:
        turn-scaling: false
        rotator: body_controller
        vector: move.movealign
        rotation-targets:
            lift:
                conditions:
                    - lift(true)
                    - state(ground)
                pitch: 0.0
                interval: 0.2
            no_lift:
                conditions:
                    - lift(false)
                    - state(ground)
                pitch: -10.0
                roll: 0.0
                interval: 0.2
                snap: true
            crash:
                conditions:
                    - OR(passengers=false;has_fuel=false;throttle_less_than=10)
                    - state(flying)
                pitch: 40.0
                interval: 0.3
    states:
        ground:
            switch-parameters:
                velocity:
                    y: -1.0,1.0
                rotations:
                    pitch: -15.0,15.0
                    roll: -15.0,15.0
            animations:
                forward:
                    - forward
                engine_active:
                    - engine_active
            keybinds:
                SHIFT_W: THROTTLE_UP
                SHIFT_S: THROTTLE_DOWN
                SHIFT_A: TURN_LEFT
                SHIFT_D: TURN_RIGHT
                SHIFT_LEFT_CLICK: SEAT_SELECTION
        flying:
            animations:
                engine_active:
                    - engine_active
                crash:
                    - crash
            keybinds:
                SHIFT_W: THROTTLE_UP
                SHIFT_S: THROTTLE_DOWN
                SHIFT_A: TURN_LEFT_LOCAL
                SHIFT_D: TURN_RIGHT_LOCAL
                W: PITCH_DOWN
                S: PITCH_UP
                A: ROLL_LEFT
                D: ROLL_RIGHT
                SPACE_W: PITCH_DOWN
                SPACE_S: PITCH_UP
                SPACE_A: ROLL_LEFT
                SPACE_D: ROLL_RIGHT
                SHIFT_LEFT_CLICK: SEAT_SELECTION
    custom-effects:
        engine_start:
            - animation(engine_start)
            - sound(move;vehicleframework:radial_engine_start;6.0;1.0)
            - delay(20)
            - particle(campfire_cosy_smoke;exhaust1.exhaust1align;1;0.1;0.3)
            - particle(campfire_cosy_smoke;exhaust2.exhaust2align;1;0.1;0.3)
            - delay(25)
            - particle(campfire_cosy_smoke;exhaust1.exhaust1align;5;0.2;0.8)
            - particle(campfire_cosy_smoke;exhaust2.exhaust2align;5;0.2;0.8)
            - delay(5)
            - particle(campfire_cosy_smoke;exhaust1.exhaust1align;5;0.2;0.4)
            - particle(campfire_cosy_smoke;exhaust2.exhaust2align;5;0.2;0.4)
            - delay(30)
        fire_start:
            - death(explode)
            - sound(engine;minecraft:entity.zombie.attack_iron_door;6.0;1.0)
            - delay(1)
            - sound(engine;minecraft:item.firecharge.use;6.0;0.7)
    components:
        engine:
            sounds:
                plane_engine:
                    sound: "vehicleframework:plane_engine"
                    doppler: true
                    pitched: true
                    max-pitch: 1.0
                    min-pitch: 0.85
                    pitch: 1.0
                    volume: 6.0
            requires-start: true
            health: 200.0
            repair-time: 60
            fuel-burn-rate: 3
            fuel: arcane_fuel
            fuel-capacity: 2200
            refuel-states:
                - GROUND
            damage-chance: 0.7
            armor: aircraft
            role: engine_aircraft
            max: 100
            min: -10
            speed: 0.8
            turn-rate: 0.3
            vfx:
                - move
        hull:
            health: 400.0
            repair-time: 100
            damage-chance: 1.0
            armor: aircraft
            role: hull_aircraft
            vfx:
                - move
        wings:
            lift: 6.1
            turn-rate: 0.6
            health: 200.0
            repair-time: 100
            damage-chance: 1.0
            armor: aircraft
            role: wings
            vfx:
                - move
    seats:
        - captain(pilot)
        - mechanic(gunner)
    weapons:
        rear_gun:
            name: "§eRear Rifle"
            template: gun_turret
            seat: gunner
            body-bone: "gunturret"
            head-bone: "gunrotator"
            bones:
                - exit2.exitalign2
        machine_guns:
            name: "§eFront Rifles"
            seat: pilot
            fixed: true
            reload-time: 5
            cooldown: 2
            reload-states:
                - GROUND
            accepted-ammunition:
                - bullet
            bones:
                - gun_exit.gun_align
                - gun_exit2.gun_align2
            data:
                shoot-sounds:
                    sound:
                        sound: "vehicleframework:gun"
                        pitch: 1.0
                        volume: 6.0
                reload-sounds:
                    sound:
                        sound: "vehicleframework:gun_reload"
                        pitch: 1.0
                        volume: 1.0
                reload-start-sounds:
                    sound:
                        sound: "vehicleframework:gun_reload"
                        pitch: 1.0
                        volume: 1.0
                particles:
                    particle1:
                        particle: FLAME
                        amount: 4
                        spread: 0.05
                        speed: 0.3
            keybinds:
                RIGHT_CLICK: WEAPON_RELOAD #WEAPON_RELOAD_AND_SHOOT
                SPACE: WEAPON_SHOOT
                LEFT_CLICK: WEAPON_SWITCH
        bomb_bay:
            name: "§eBomb Bay"
            seat: pilot
            fixed: true
            reload-time: 5
            cooldown: 10
            reload-states:
                - GROUND
            accepted-ammunition:
                - small_bomb
            bones:
                - bomb_bay1.bomb_bay_align1
                - bomb_bay2.bomb_bay_align2
            data:
                shoot-sounds:
                    sound:
                        sound: "vehicleframework:clank"
                        pitch: 1.0
                        volume: 3.0
                reload-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
                reload-start-sounds:
                    sound:
                        sound: "minecraft:block.anvil.land"
                        pitch: 1.0
                        volume: 1.0
            keybinds:
                RIGHT_CLICK: WEAPON_RELOAD #WEAPON_RELOAD_AND_SHOOT
                SPACE: WEAPON_SHOOT
                LEFT_CLICK: WEAPON_SWITCH