wooden_cart:
    name: "§l§eWooden Cart"
    model: wooden_cart
    skins:
        wooden_cart:
            name: "Wooden Cart"
            model: wooden_cart
    death:
        explode:
            fragments: 10
            duration: 320
            sounds:
                explode:
                    sound: "vehicleframework:explosion"
                    pitch: 1.0
                    volume: 8.0
    towing:
        bone: tow_connection
        reversed: true
    behaviour:
        turn-scaling: false
        rotator: body_controller
        vector: move.movealign
        secondary-rotators:
            - connector_rotator
        rotation-targets:
            no_horses:
                rotator: connector_rotator
                conditions:
                    - AND(seat_empty=horse_mount1;seat_empty=horse_mount2)
                pitch: 25.0
                interval: 0.2
            horses:
                rotator: connector_rotator
                conditions:
                    - OR(seat_filled=horse_mount1;seat_filled=horse_mount2)
                pitch: 0.0
                interval: 0.2
    states:
        ground:
            terrain-follow: true
            step-height: 1
            ground-probes:
              - ground_fl
              - ground_fr
              - ground_bl
              - ground_br
            climb: 1
            animations:
                forward:
                    - forward
                backward:
                    - backward
            keybinds:
                W: FORWARD
                S: BACKWARD
                A: TURN_LEFT
                D: TURN_RIGHT
                SHIFT: SEAT_SELECTION
    containers:
        cart:
            seat: passenger_2
            name: "§eCart Inventory"
            size: 54
            bones:
                - stuff1
                - stuff2
                - stuff3
                - stuff4
                - stuff5
                - stuff6
                - stuff7
                - stuff8
                - stuff9
    components:
        harness:
            health: 100.0
            repair-time: 60
            damage-chance: 0.8
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.2)
                - bullet(0.6)
                - entity_explosion(1.5)
                - small_bomb(3.0)
                - cannonball(1.3)
            turn-rate: 0.4
            mount-bones:
                - horse_mount1
                - horse_mount2
            vfx:
                - vfx
        hull:
            health: 150.0
            repair-time: 100
            damage-chance: 1.0
            damage:
                - FALL(0.0)
                - entity_attack(0.1)
                - projectile(0.2)
                - bullet(0.6)
                - entity_explosion(1.5)
                - small_bomb(3.0)
                - cannonball(1.3)
            vfx:
                - vfx1
                - vfx2
    seats:
        - captain(driver)
        - passenger(passenger_1)
        - passenger(passenger_2)